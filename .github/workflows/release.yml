name: Release

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag and package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Publish beta
        if: vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && contains(github.ref_name, 'beta')
        run: npm publish --provenance --access public --tag next
      - name: Publish stable
        if: vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && !contains(github.ref_name, 'beta')
        run: npm publish --provenance --access public --tag latest
      - name: Create GitHub prerelease
        if: contains(github.ref_name, 'beta')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
      - name: Create GitHub stable release
        if: ${{ !contains(github.ref_name, 'beta') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
